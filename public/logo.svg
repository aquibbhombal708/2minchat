<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="transparent"/>
  <!-- Document outline -->
  <rect x="14" y="10" width="72" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Top corner fold / document mark -->
  <path d="M 64 10 L 86 32 L 64 32 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Document lines -->
  <line x1="26" y1="26" x2="52" y2="26" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Bold 2 Typography -->
  <text x="50" y="65" font-family="'Courier New', Courier, monospace, 'SF Pro Display', -apple-system, sans-serif" font-size="36" font-weight="900" text-anchor="middle" fill="#000000">2</text>
  <!-- Base status line -->
  <line x1="26" y1="76" x2="74" y2="76" stroke="#000000" stroke-width="2.5" stroke-dasharray="4 3"/>
</svg>
